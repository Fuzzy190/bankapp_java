spring.application.name=bankapp
server.port=8089

spring.datasource.url=jdbc:mysql://localhost:3306/bankapp_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Turn off Hibernate SQL logs to keep the CLI UI clean
spring.jpa.show-sql=false
# Suppress standard Spring Boot startup logs
logging.level.root=WARN